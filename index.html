
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمات المرور العراقي</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f3f7;
  color: #172b40;
}
header {
  background: #123b65;
  color: white;
  text-align: center;
  padding: 28px 15px;
}
header h1 { margin: 0 0 10px; }
main {
  width: 92%;
  max-width: 480px;
  margin: 24px auto;
}
.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px #0000000d;
}
label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border-radius: 8px;
  font-size: 16px;
}
input, select { border: 1px solid #cbd5e1; }
button {
  background: #123b65;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}
.note {
  font-size: 13px;
  color: #586779;
  line-height: 1.8;
}
#result {
  line-height: 1.8;
  overflow-wrap: anywhere;
}
a { color: #123b65; }
</style>
</head>
<body>

<header>
  <h1>خدمات المرور العراقي</h1>
  <p>خدمات المركبات في العراق</p>
</header>

<main>
  <section class="card">
    <h2>الاستعلام عن المركبة</h2>

    <label for="plate">رقم لوحة المركبة</label>
    <input id="plate" placeholder="اكتب رقم اللوحة">

    <label for="vehicle">نوع المركبة</label>
    <select id="vehicle">
      <option value="">اختر نوع المركبة</option>
      <option>خصوصي</option>
      <option>أجرة</option>
      <option>حمل</option>
      <option>دراجة نارية</option>
      <option>أخرى</option>
    </select>

    <label for="province">المحافظة</label>
    <select id="province">
      <option value="">اختر المحافظة</option>
      <option>بغداد</option>
      <option>البصرة</option>
      <option>نينوى</option>
      <option>أربيل</option>
      <option>النجف</option>
      <option>كربلاء</option>
      <option>بابل</option>
      <option>الأنبار</option>
      <option>ديالى</option>
      <option>كركوك</option>
      <option>صلاح الدين</option>
      <option>واسط</option>
      <option>ميسان</option>
      <option>ذي قار</option>
      <option>المثنى</option>
      <option>القادسية</option>
      <option>دهوك</option>
      <option>السليمانية</option>
      <option>حلبجة</option>
    </select>

    <button onclick="searchVehicle()">
      متابعة الاستعلام
    </button>

    <div id="result" aria-live="polite"></div>
  </section>

  <section class="card">
    <h3>تنبيه للمستخدم</h3>
    <p class="note">
      هذه نسخة تجريبية. بيانات المركبة لا تُرسل إلى
      قاعدة بيانات حكومية، ولا تعرض هذه الصفحة الغرامات
      الحقيقية.
    </p>
    <p>
      <a href="https://ur.gov.iq/" target="_blank"
      rel="noopener noreferrer">
        بوابة أور للخدمات الحكومية
      </a>
    </p>
  </section>
</main>

<script>
function searchVehicle() {
  const plate = document.getElementById("plate").value.trim();
  const vehicle = document.getElementById("vehicle").value;
  const province = document.getElementById("province").value;
  const result = document.getElementById("result");

  if (!plate || !vehicle || !province) {
    result.textContent = "يرجى ملء جميع الخانات أولاً.";
    return;
  }

  result.textContent =
    "اكتملت بيانات المركبة التجريبية. " +
    "للتأكد من الغرامات الحقيقية، استخدم الخدمة الرسمية.";
}
</script>

</body>
</html>
